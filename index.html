<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتب الرياضيات</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: #1a1a2e;
      color: #fff;
      padding: 24px 16px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      bottom: 0;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      text-align: center;
    }
    .sidebar ul { list-style: none; }
    .sidebar li { margin-bottom: 6px; }
    .sidebar a {
      display: block;
      padding: 10px 14px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s;
      font-size: 15px;
    }
    .sidebar a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .sidebar a.active { background: #4361ee; color: #fff; }
    .sidebar .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.4);
      margin: 20px 14px 8px;
    }

    .main {
      margin-right: 260px;
      flex: 1;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .welcome {
      max-width: 600px;
      text-align: center;
    }
    .welcome h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #1a1a2e;
    }
    .welcome p {
      font-size: 16px;
      color: #666;
      line-height: 1.8;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }
      .main { margin-right: 0; padding: 20px; }
      body { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="sidebar" id="sidebar">
    <h2>كتب الرياضيات</h2>
    <ul id="file-list">
      <!-- filled by JS -->
    </ul>
  </nav>

  <main class="main">
    <div class="welcome">
      <h1>كتب الرياضيات</h1>
      <p>اختر مفرداً من القائمة الجانبية لفتحه.</p>
    </div>
  </main>

  <script>
    const files = [
      { name: 'limits.html', label: 'limits.html', icon: '∞' }
    ];

    const list = document.getElementById('file-list');
    const current = location.pathname.split('/').pop();

    files.forEach(f => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = f.name;
      a.textContent = f.icon + '  ' + f.label;
      if (current === f.name) a.classList.add('active');
      li.appendChild(a);
      list.appendChild(li);
    });

    // Auto-load in iframe if opened via sidebar
    if (current && current !== 'index.html' && current !== '') {
      document.querySelector('.main').innerHTML =
        '<iframe src="' + current + '" style="width:100%;height:100vh;border:none;"></iframe>';
    }
  </script>

</body>
</html>
